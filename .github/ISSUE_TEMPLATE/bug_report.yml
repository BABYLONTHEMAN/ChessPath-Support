name: Bug report
description: Report a ChessPath bug or interface problem
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Thanks for testing ChessPath. Please include enough detail to reproduce the problem."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ChessPath\n2. Play ...\n3. Click ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ChessPath version
      placeholder: "0.12.0 BETA"
  - type: input
    id: browser
    attributes:
      label: Chrome / OS
      placeholder: "Chrome 153, Windows 11"
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or extra details
